name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Bosak.Schema.slnx -c Release
      - name: Test
        run: dotnet test Bosak.Schema.slnx -c Release --no-build
      - name: Documentation hygiene
        shell: pwsh
        run: ./tools/check-docs.ps1 -ProjectPath .
