name: build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release refusal controls (no login or push)
        shell: pwsh
        run: |
          python -m unittest discover -s .github/scripts -p test_schema_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test .github/scripts/test-schema-source-run.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: dotnet build Bosak.Schema.slnx -c Release
      - name: Test
        run: dotnet test Bosak.Schema.slnx -c Release --no-build
      - name: Documentation hygiene
        shell: pwsh
        run: ./tools/check-docs.ps1 -ProjectPath .
      - name: Workload tool build and measurement-integrity controls
        shell: pwsh
        run: |
          dotnet build tools/Bosak.Schema.Workloads/Bosak.Schema.Workloads.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools -p test_schema_workloads.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
