name: Schema release

# NuGet policy binds to this repository and workflow filename (release.yml).
# Preparation is the default. Publication requires a separately reviewed run/hash.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish previously reviewed hosted artifacts (default prepares only)
        type: boolean
        default: false
      source_run_id:
        description: Successful first-attempt preparation run ID, required for publication
        type: string
        default: ''
      expected_manifest_sha256:
        description: Reviewed release-manifest.json SHA-256, required for publication
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: schema-release
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 1783d1a99b37e206b10592c24b3a5fa3ac126969
  PACKAGE_VERSION: 0.5.0-alpha.0.7

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    name: prepare
    if: github.repository == 'Fytala-Charles/Bosak.Schema' && github.ref == 'refs/heads/main' && !inputs.publish
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Verify release refusal controls
        run: |
          python -m unittest discover -s controller/.github/scripts -p test_schema_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test controller/.github/scripts/test-schema-source-run.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c953ebe0057bea1616d3e4f891f7b0a5fc4bd99b
          fetch-depth: 0
          path: baseline
          persist-credentials: false
      - name: Build and test exact accepted source
        run: |
          dotnet build source/Bosak.Schema.slnx -c Release --artifacts-path "$env:RUNNER_TEMP/source-build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test source/Bosak.Schema.slnx -c Release --no-build --artifacts-path "$env:RUNNER_TEMP/source-build" --logger trx --results-directory "$env:RUNNER_TEMP/results/source"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack source/src/Bosak.Schema/Bosak.Schema.csproj -c Release --no-build --artifacts-path "$env:RUNNER_TEMP/source-build" --output "$env:RUNNER_TEMP/package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify package-only public consumer and exact dependency payloads
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'NuGet.Config'
          @"
          <configuration><packageSources><clear/><add key="prepared" value="$env:RUNNER_TEMP/package"/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>
          "@ | Set-Content -LiteralPath $config -Encoding utf8
          dotnet restore source/tests/Bosak.Schema.PublicConsumer.Tests/Bosak.Schema.PublicConsumer.Tests.csproj -p:SchemaConsumerPackageVersion=$env:PACKAGE_VERSION --artifacts-path "$env:RUNNER_TEMP/consumer" --packages "$env:RUNNER_TEMP/cache" --configfile $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test source/tests/Bosak.Schema.PublicConsumer.Tests/Bosak.Schema.PublicConsumer.Tests.csproj -c Release --no-restore -p:SchemaConsumerPackageVersion=$env:PACKAGE_VERSION --artifacts-path "$env:RUNNER_TEMP/consumer" --logger trx --results-directory "$env:RUNNER_TEMP/results/consumer"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python controller/.github/scripts/schema_release.py consumer --package "$env:RUNNER_TEMP/package/Bosak.Schema.$env:PACKAGE_VERSION.nupkg" --cache "$env:RUNNER_TEMP/cache" --output "$env:RUNNER_TEMP/consumer/bin/Bosak.Schema.PublicConsumer.Tests/release" --assets "$env:RUNNER_TEMP/consumer/obj/Bosak.Schema.PublicConsumer.Tests/project.assets.json" --results "$env:RUNNER_TEMP/results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify retained legacy test binaries
        run: |
          dotnet build baseline/tests/Bosak.Schema.Tests/Bosak.Schema.Tests.csproj -c Release --artifacts-path "$env:RUNNER_TEMP/baseline-build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python controller/.github/scripts/schema_release.py legacy --baseline "$env:RUNNER_TEMP/baseline-build/bin/Bosak.Schema.Tests/release" --package "$env:RUNNER_TEMP/package/Bosak.Schema.$env:PACKAGE_VERSION.nupkg" --results "$env:RUNNER_TEMP/results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Seal qualified immutable package manifest
        run: |
          python controller/.github/scripts/schema_release.py seal --directory "$env:RUNNER_TEMP/package" --source-root source --source-commit $env:SOURCE_COMMIT --version $env:PACKAGE_VERSION --controller-commit $env:GITHUB_SHA --results "$env:RUNNER_TEMP/results"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: schema-nuget-${{ github.sha }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schema-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: publish
    if: github.repository == 'Fytala-Charles/Bosak.Schema' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false
      - name: Validate successful preparation provenance
        id: preparation
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        with:
          script: |
            await require(process.env.GITHUB_WORKSPACE + '/controller/.github/scripts/schema-source-run.cjs')({ github, context, core });
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.preparation.outputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          path: ${{ runner.temp }}/package
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Verify reviewed bytes and registry absence before authentication
        env:
          CONTROLLER_COMMIT: ${{ steps.preparation.outputs.controller_sha }}
          EXPECTED_MANIFEST: ${{ inputs.expected_manifest_sha256 }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) { throw 'Set the NUGET_USER repository variable to the NuGet profile name.' }
          python controller/.github/scripts/schema_release.py absent --directory "$env:RUNNER_TEMP/package" --source-root source --source-commit $env:SOURCE_COMMIT --version $env:PACKAGE_VERSION --controller-commit $env:CONTROLLER_COMMIT --expected-manifest $env:EXPECTED_MANIFEST
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: NuGet trusted-publishing login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push one verified package without rebuilding
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          CONTROLLER_COMMIT: ${{ steps.preparation.outputs.controller_sha }}
          EXPECTED_MANIFEST: ${{ inputs.expected_manifest_sha256 }}
        run: |
          python controller/.github/scripts/schema_release.py absent --directory "$env:RUNNER_TEMP/package" --source-root source --source-commit $env:SOURCE_COMMIT --version $env:PACKAGE_VERSION --controller-commit $env:CONTROLLER_COMMIT --expected-manifest $env:EXPECTED_MANIFEST
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet nuget push "$env:RUNNER_TEMP/package/Bosak.Schema.$env:PACKAGE_VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --no-symbols
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
